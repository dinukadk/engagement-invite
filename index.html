<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><<Man Name>> & <<Woman Name>> - Engagement</title>
    <!-- CSS ගොනුව සම්බන්ධ කිරීම -->
    <link rel="stylesheet" href="style.css">
    
    <!-- ලස්සන Fonts සඳහා Google Fonts භාවිතා කිරීම -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Laptop එකෙන් බැලුවත් Phone එකක් වගේ මැදින් පේන්න මේ Container එක පාවිච්චි කරනවා -->
    <div class="mobile-container">
        
        <!-- ========================================== -->
        <!-- 1. VIDEO SECTION (Top Hero Section)        -->
        <!-- ========================================== -->
        <div class="video-section">
            <!-- ඔයාගේ 16:9 වීඩියෝ එක මෙතනින් play වෙනවා (Auto play වෙනවා සද්දෙ නැතුව) -->
            <video autoplay loop muted playsinline>
                <source src="assets/Couple_Video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            
            <!-- වීඩියෝ එක උඩින් වැටෙන වචන -->
            <div class="video-overlay-text">
                <p>WE ARE GETTING ENGAGED</p>
                <!-- මෙතන යුවළගේ නම් දෙක වෙනස් කරන්න -->
                <h1><<Man Name>> <br> & <br> <<Woman Name>></h1>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 2. WELCOME MESSAGE SECTION                 -->
        <!-- ========================================== -->
        <div class="welcome-section">
            <!-- සිංහල ආරාධනා වාක්‍ය මෙතනින් වෙනස් කරන්න -->
            <p class="sinhala-text">
                අපගේ ජීවිතයේ සුන්දරම ආරම්භය සනිටුහන් කරන මේ මොහොතට, අපට ආදරය කරන ඔබ සැමට ආදරයෙන් ආරාධනා කරමු.
            </p>
        </div>

        <!-- ========================================== -->
        <!-- 3. COUPLE IMAGE SECTION (1:1 Image)        -->
        <!-- ========================================== -->
        <div class="image-section">
            <!-- ඔයාගේ AI ජෙනරේට් කරපු පින්තූරය මෙතනින් පෙන්වයි -->
            <img src="assets/Couple_Image.jpeg" alt="Couple Image">
        </div>

        <!-- ========================================== -->
        <!-- 4. EVENT DETAILS SECTION                   -->
        <!-- ========================================== -->
        <div class="details-section">
            <div class="detail-card">
                <h3>The Date</h3>
                <!-- දිනය මෙතනින් වෙනස් කරන්න -->
                <p class="bold-text"><<Date>></p>
                <!-- මාසය සහ අවුරුද්ද -->
                <p><<Month, Year>></p> 
            </div>

            <div class="detail-card">
                <h3>The Time</h3>
                <!-- වේලාව මෙතනින් වෙනස් කරන්න -->
                <p class="bold-text"><<Time>></p>
            </div>

            <div class="detail-card">
                <h3>The Venue</h3>
                <!-- ස්ථානයේ නම මෙතනින් වෙනස් කරන්න -->
                <p class="bold-text"><<Location Name>></p>
                <!-- සම්පූර්ණ ලිපිනය මෙතනින් වෙනස් කරන්න -->
                <p><<Full Address>></p>
                
                <!-- Google Maps Link එක මෙතන (href ඇතුලේ) දාන්න -->
                <a href="<<Google Maps Link Here>>" target="_blank" class="map-button">Open in Google Maps</a>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 5. FOOTER SECTION                          -->
        <!-- ========================================== -->
        <div class="footer-section">
            <p>With Love,</p>
            <!-- නැවතත් නම් දෙක මෙතනට දෙන්න -->
            <h2><<Man Name>> & <<Woman Name>></h2>
        </div>

    </div>

</body>
</html>
